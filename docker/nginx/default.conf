server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CodeIgniter 4 API
    location /api/ {
        include fastcgi_params;
        fastcgi_pass ci4:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}