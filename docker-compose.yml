services:
  nginx:
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - ci4

  ci4:
    build:
      context: .
      dockerfile: docker/ci4/Dockerfile
    user: "${UID}:${GID}"
    volumes:
      - ./backend:/var/www/html
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-production}
      database.default.hostname: db
      database.default.database: ${MYSQL_DATABASE}
      database.default.username: ${MYSQL_USER}
      database.default.password: ${MYSQL_PASSWORD}
      database.default.DBDriver: MySQLi
      database.default.port: ${DB_PORT:-3306}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_EXPIRATION: ${ACCESS_TOKEN_EXPIRATION:-3600}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-2592000}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db

volumes:
  db_data: